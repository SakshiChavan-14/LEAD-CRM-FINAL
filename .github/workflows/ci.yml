name: CI Quality Gates

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint Gate Check
        working-directory: ./frontend
        run: npm run lint

      - name: Run Production Build Gate Check
        working-directory: ./frontend
        run: npm run build

# Optional Future Quality Gates (Documented for roadmap):
# 1. Unit & Integration Test Suite Execution (`npm test`)
# 2. Dependency Boundary Validation (`npx dependency-cruiser`)
# 3. Next.js Production Bundle Analysis (`@next/bundle-analyzer`)
